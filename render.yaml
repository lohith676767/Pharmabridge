services:
  - type: web
    name: pharmabridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ENV
        value: production
      # Postgres connection string (e.g. from Neon). Run history lives in
      # this database rather than on the web host's ephemeral disk, so it
      # survives redeploys and restarts. Paste the value into the Render
      # dashboard — sync:false keeps the credential out of this repo.
      - key: DATABASE_URL
        sync: false
